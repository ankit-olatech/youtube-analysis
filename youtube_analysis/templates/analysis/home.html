<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        #loader {

            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(255, 255, 255, 0.8);

            z-index: 9999;

            text-align: center;

            padding-top: 20%;

        }

        #loader .spinner-border {

            width: 3rem;

            height: 3rem;

        }

    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Welcome to the YouTube Video Analysis App</h1>
        <p>Enter a YouTube video URL or upload a video file to get started.</p>

        <!-- Form for YouTube URL Input -->
        <form method="post" action="{% url 'analyze_url' %}" class="mb-4" onsubmit="showLoader()">

            {% csrf_token %}
        
            <div class="mb-3">
        
                <label for="youtube_url" class="form-label">YouTube Video URL:</label>
        
                <input type="url" class="form-control" id="youtube_url" name="youtube_url" placeholder="https://www.youtube.com/watch?v=..." required>
        
            </div>
        
            <button type="submit" class="btn btn-primary">Analyze YouTube Video</button>
        
        </form>

        <!-- Form for Video File Upload -->
        <form method="post" action="{% url 'analyze_file' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="video_file" class="form-label">Upload Video File:</label>
                <input type="file" class="form-control" id="video_file" name="video_file" accept="video/*" required>
            </div>
    
            <div class="mb-3">
                <label for="thumbnail_file" class="form-label">Upload Thumbnail (Optional):</label>
                <input type="file" class="form-control" id="thumbnail_file" name="thumbnail_file" accept="image/*">
            </div>
            <button type="submit" class="btn btn-secondary">Analyze Uploaded Video</button>
        </form>

    </div>


       <!-- Loader -->
<div id="loader">

    <div class="spinner-border" role="status">

        <span class="visually-hidden">Loading...</span>

    </div>

    <div id="loader-text" class="mt-3">Initializing...</div>

    <div id="loader-progress" class="mt-2">0%</div>

</div>


    <script>

        function showLoader() {

            document.getElementById('loader').style.display = 'block';

            updateLoader(0, "Initializing...");

            startProgressPolling();

        }


        function updateLoader(progress, message) {
    document.getElementById('loader-progress').innerText = progress.percentage + '%';
    document.getElementById('loader-text').innerText = progress.message;
}

function startProgressPolling() {
    const interval = setInterval(() => {
        fetch('/update_progress/')
            .then(response => response.json())
            .then(data => {
                updateLoader(data, "Processing... " + data.percentage + "%");
                if (data.percentage >= 100) {
                    clearInterval(interval);
                    // Optionally redirect to results page or show a success message
                }
            });
    }, 1000); // Poll every second
}

// Function to get CSRF token from cookies
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            // Check if this cookie string begins with the name we want
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

    </script>
</body>
</html>
